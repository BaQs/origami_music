type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#music"
    name: Music
  - &music
    type: custom:origami-music
    layout: player
    select: input_select.speaker
    players:
      media_player.living_room_speaker: media_player.living_room
      media_player.kitchen_speaker: media_player.kitchen
      media_player.bedroom_speaker: media_player.bedroom
    names:
      media_player.living_room_speaker: Living room
      media_player.kitchen_speaker: Kitchen
      media_player.bedroom_speaker: Bedroom
  - <<: *music
    layout: speakers
  - <<: *music
    layout: queue
    limit: 4
  - <<: *music
    layout: shelf
    size: s
    title: Recently played
    link:
      text: Library ›
      path: "#library"
